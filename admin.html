<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin - Promoções</title>
<style>
  :root{--bg:#f4f5f7;--card:#fff;--line:#e2e4e9;--txt:#1d2430;--mut:#6b7280;--pri:#2563eb;--ok:#16a34a;--warn:#d97706;--bad:#dc2626}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font:15px system-ui,sans-serif}
  header{display:flex;align-items:center;gap:12px;padding:14px 20px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
  header h1{font-size:18px;margin:0;flex:1}
  main{max-width:1100px;margin:0 auto;padding:20px}
  button,input,select{font:inherit}
  button{padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:pointer}
  button:hover{background:#f0f2f5}
  button.pri{background:var(--pri);border-color:var(--pri);color:#fff}
  button.pri:hover{background:#1d4ed8}
  input[type=text],input[type=email],input[type=password],input[type=number],input[type=datetime-local],input:not([type]),select{padding:8px;border:1px solid var(--line);border-radius:8px;width:100%;background:#fff}
  .box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}

  #drop{border:2px dashed #b6bcc8;border-radius:12px;padding:36px 16px;text-align:center;color:var(--mut);cursor:pointer;transition:.15s;background:#fafbfc}
  #drop.over{border-color:var(--pri);background:#eff4ff;color:var(--pri)}
  #drop b{display:block;font-size:17px;color:var(--txt);margin-bottom:4px}
  .opts{display:flex;flex-wrap:wrap;gap:12px;margin-top:14px;align-items:flex-end}
  .opts label{display:flex;flex-direction:column;font-size:13px;color:var(--mut);gap:4px;flex:1;min-width:150px}

  #queue{margin-top:10px;font-size:14px}
  #queue div{padding:4px 0;color:var(--mut)}

  .bar{display:flex;align-items:center;gap:10px;margin:8px 0 12px;flex-wrap:wrap}
  .bar h2{font-size:16px;margin:0;flex:1}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
  .item{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
  .item.dragging{opacity:.4}
  .item.dropbefore{outline:3px solid var(--pri)}
  .thumb{position:relative;background:#111;aspect-ratio:16/9}
  .thumb img{width:100%;height:100%;object-fit:contain;display:block}
  .badge{position:absolute;top:8px;left:8px;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:600;color:#fff}
  .live{background:var(--ok)}.sched{background:var(--pri)}.exp{background:var(--bad)}.paused{background:#6b7280}
  .num{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.65);color:#fff;border-radius:99px;padding:2px 9px;font-size:12px}
  .dim{position:absolute;bottom:8px;right:8px;background:rgba(0,0,0,.65);color:#fff;border-radius:6px;padding:1px 7px;font-size:11px}
  .body{padding:10px;display:flex;flex-direction:column;gap:8px}
  .body label{font-size:12px;color:var(--mut);display:flex;flex-direction:column;gap:3px}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .acts{display:flex;gap:6px;flex-wrap:wrap}
  .acts button{flex:1;padding:6px}
  .del{color:var(--bad)}
  .item.paused-card .thumb img{opacity:.4}
  .empty{color:var(--mut);padding:30px;text-align:center}

  .where{font-size:12px;font-weight:600}
  .where.all{color:var(--mut)} .where.some{color:var(--pri)}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .body label.chip,label.chip{flex-direction:row;align-items:center;gap:5px;border:1px solid var(--line);border-radius:99px;padding:3px 10px;font-size:12px;color:var(--txt);background:#fafbfc;cursor:pointer;min-width:0;flex:0 0 auto}
  label.chip input{width:auto;margin:0}

  .srow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .srow:last-child{border-bottom:0}
  .srow button{padding:5px 9px;font-size:13px}
  .dot{width:10px;height:10px;border-radius:50%;background:#b6bcc8;flex:none}
  .dot.on{background:var(--ok);box-shadow:0 0 0 3px #16a34a33}

  #toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1d2430;color:#fff;padding:10px 16px;border-radius:10px;opacity:0;pointer-events:none;transition:.25s;z-index:20}
  #toast.show{opacity:1}
  #toast.err{background:var(--bad)}
  #login{max-width:340px;margin:60px auto}
  #login input{margin-bottom:10px}
</style>
</head>
<body>
<header>
  <h1>Promoções</h1>
  <button id="outBtn" onclick="logout()" hidden>Sair</button>
</header>

<main>
  <div id="login" class="box" hidden>
    <h3 style="margin-top:0">Login</h3>
    <input id="email" type="email" placeholder="email" autocomplete="username">
    <input id="pass" type="password" placeholder="senha" autocomplete="current-password">
    <button class="pri" style="width:100%" onclick="login()">Entrar</button>
  </div>

  <div id="app" hidden>

    <!-- SCREENS -->
    <div class="box">
      <div class="bar" style="margin-top:0"><h2>Telas <small id="scrCount" style="color:var(--mut);font-weight:400"></small></h2></div>
      <div id="screens"></div>
      <div class="opts">
        <label>Nome da tela<input id="scrName" placeholder="Ex: TV Entrada"></label>
        <label>Código no link (opcional)<input id="scrSlug" placeholder="ex: entrada"></label>
        <button class="pri" onclick="addScreen()">Adicionar tela</button>
      </div>
    </div>

    <!-- UPLOAD -->
    <div class="box">
      <div id="drop" tabindex="0">
        <b>Arraste as imagens aqui</b>
        ou clique para escolher (várias de uma vez) · ou cole com Ctrl+V
      </div>
      <input id="file" type="file" accept="image/*" multiple hidden>
      <div class="opts">
        <label>Segundos na tela (padrão)<input id="dur" type="number" value="8" min="2"></label>
        <label>Começa em (opcional)<input id="starts" type="datetime-local"></label>
        <label>Termina em (opcional)<input id="ends" type="datetime-local"></label>
        <div style="flex-basis:100%">
          <small style="color:var(--mut)">Mostrar em (nenhuma marcada = todas as telas)</small>
          <div id="targets" class="chips" style="margin-top:6px"></div>
        </div>
      </div>
      <div id="queue"></div>
    </div>

    <div class="bar">
      <h2>Imagens <small id="count" style="color:var(--mut);font-weight:400"></small></h2>
      <select id="filter" style="width:auto"><option value="">Todas as imagens</option></select>
      <small id="hint" style="color:var(--mut)">Arraste os cartões para mudar a ordem</small>
    </div>
    <div id="list" class="grid"></div>
  </div>
</main>
<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const $ = id => document.getElementById(id);
let rows = [], screens = [], dragId = null;
const uploadTargets = new Set();

/* ---------- helpers ---------- */
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function toast(msg, isErr) {
  const t = $("toast"); t.textContent = msg; t.className = "show" + (isErr ? " err" : "");
  clearTimeout(toast.t); toast.t = setTimeout(() => t.className = "", isErr ? 4500 : 1800);
}
const toLocalInput = iso => { if (!iso) return ""; const d = new Date(iso); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 16); };
const toISO = v => v ? new Date(v).toISOString() : null;
const slugify = s => s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 40);
const isOnline = s => s.last_seen && Date.now() - new Date(s.last_seen) < 120000;
function status(p) {
  const n = Date.now();
  if (!p.active) return ["Pausada", "paused"];
  if (p.starts_at && new Date(p.starts_at) > n) return ["Agendada", "sched"];
  if (p.ends_at && new Date(p.ends_at) < n) return ["Expirada", "exp"];
  return ["No ar", "live"];
}

/* ---------- auth ---------- */
async function init() {
  const { data } = await db.auth.getSession();
  const logged = !!data.session;
  $("login").hidden = logged; $("app").hidden = !logged; $("outBtn").hidden = !logged;
  if (logged) { await loadScreens(); refresh(); }
}
async function login() {
  const { error } = await db.auth.signInWithPassword({ email: $("email").value.trim(), password: $("pass").value });
  if (error) return toast("Login falhou: " + error.message, true);
  init();
}
async function logout() { await db.auth.signOut(); init(); }
$("pass").addEventListener("keydown", e => { if (e.key === "Enter") login(); });

/* ---------- screens ---------- */
async function loadScreens() {
  const { data, error } = await db.from("screens").select("*").order("created_at");
  if (error) return toast("Telas: " + error.message + " (rodou o setup-screens.sql?)", true);
  screens = data; renderScreens(); renderTargets(); renderFilter(); render();
}
async function pollScreens() {            // only refreshes the online/offline list, never the image cards
  const { data } = await db.from("screens").select("*").order("created_at");
  if (data) { screens = data; renderScreens(); }
}
function renderScreens() {
  const on = screens.filter(isOnline).length;
  $("scrCount").textContent = screens.length ? `(${on} online de ${screens.length})` : "";
  $("screens").innerHTML = screens.length ? screens.map(s => `
    <div class="srow">
      <span class="dot ${isOnline(s) ? "on" : ""}"></span>
      <b>${esc(s.name)}</b> <small style="color:var(--mut)">${esc(s.slug)}</small>
      <small style="color:var(--mut)">${s.width ? s.width + "×" + s.height : "resolução ainda desconhecida"}${
        isOnline(s) && s.current_title ? " · mostrando: " + esc(s.current_title)
        : (!isOnline(s) && s.last_seen ? " · visto em " + new Date(s.last_seen).toLocaleString("pt-BR") : "")}</small>
      <span style="flex:1"></span>
      <button data-sa="copy" data-slug="${esc(s.slug)}">Copiar link</button>
      <button data-sa="del" data-id="${s.id}" class="del">Remover</button>
    </div>`).join("")
    : '<div class="empty" style="padding:10px">Nenhuma tela cadastrada. Sem telas, todas as imagens tocam em qualquer link.</div>';
}
$("screens").addEventListener("click", async e => {
  const a = e.target.dataset.sa; if (!a) return;
  if (a === "copy") {
    const url = location.href.replace(/[^/]*$/, "").split("?")[0] + "?screen=" + e.target.dataset.slug;
    try { await navigator.clipboard.writeText(url); toast("Link copiado ✓"); } catch { prompt("Copie o link:", url); }
  } else if (a === "del") {
    if (!confirm("Remover esta tela? As imagens marcadas só para ela deixam de aparecer em qualquer lugar.")) return;
    const { error } = await db.from("screens").delete().eq("id", e.target.dataset.id);
    if (error) return toast(error.message, true);
    await loadScreens(); toast("Tela removida");
  }
});
async function addScreen() {
  const name = $("scrName").value.trim();
  if (!name) return toast("Dê um nome à tela.", true);
  const slug = slugify($("scrSlug").value.trim() || name);
  if (slug.length < 2) return toast("Código inválido (use letras e números).", true);
  const { error } = await db.from("screens").insert({ name, slug });
  if (error) return toast(error.code === "23505" ? "Já existe uma tela com esse código." : error.message, true);
  $("scrName").value = ""; $("scrSlug").value = "";
  await loadScreens(); toast("Tela adicionada ✓");
}
function renderTargets() {
  $("targets").innerHTML = screens.length
    ? screens.map(s => `<label class="chip"><input type="checkbox" value="${esc(s.slug)}" ${uploadTargets.has(s.slug) ? "checked" : ""}>${esc(s.name)}</label>`).join("")
    : '<small style="color:var(--mut)">Cadastre telas acima para escolher onde cada imagem aparece.</small>';
}
$("targets").addEventListener("change", e => { e.target.checked ? uploadTargets.add(e.target.value) : uploadTargets.delete(e.target.value); });
function renderFilter() {
  const cur = $("filter").value;
  $("filter").innerHTML = '<option value="">Todas as imagens</option>' +
    screens.map(s => `<option value="${esc(s.slug)}">Só o que toca em: ${esc(s.name)}</option>`).join("");
  $("filter").value = screens.some(s => s.slug === cur) ? cur : "";
}
$("filter").addEventListener("change", render);

/* ---------- list ---------- */
async function refresh() {
  const { data, error } = await db.from("promotions").select("*").order("position").order("created_at");
  if (error) return toast(error.message, true);
  rows = data; render();
}
function render() {
  const flt = $("filter").value;
  const view = flt ? rows.filter(p => !(p.screen_slugs || []).length || p.screen_slugs.includes(flt)) : rows;
  const canMove = !flt;
  $("hint").textContent = canMove ? "Arraste os cartões para mudar a ordem" : "Para mudar a ordem, volte para “Todas as imagens”";
  const live = view.filter(p => status(p)[1] === "live").length;
  $("count").textContent = view.length ? `(${live} no ar de ${view.length})` : "";
  if (!view.length) { $("list").innerHTML = '<div class="empty">Nenhuma imagem aqui. Arraste a primeira acima 👆</div>'; return; }
  $("list").innerHTML = view.map((p, i) => {
    const [label, cls] = status(p);
    const tgt = p.screen_slugs || [];
    const where = tgt.length
      ? "Só em: " + tgt.map(sl => screens.find(s => s.slug === sl)?.name || sl + " (removida)").join(", ")
      : "Todas as telas";
    const chips = screens.map(s => `<label class="chip"><input type="checkbox" data-f="screen_slugs" value="${esc(s.slug)}" ${tgt.includes(s.slug) ? "checked" : ""}>${esc(s.name)}</label>`).join("");
    return `
    <div class="item ${p.active ? "" : "paused-card"}" ${canMove ? 'draggable="true"' : ""} data-id="${p.id}">
      <div class="thumb">
        <img src="${esc(p.image_url)}" loading="lazy" draggable="false"
             onload="this.parentNode.querySelector('.dim').textContent=this.naturalWidth+'×'+this.naturalHeight">
        <span class="badge ${cls}">${label}</span><span class="num">${i + 1}</span><span class="dim"></span>
      </div>
      <div class="body">
        <div class="where ${tgt.length ? "some" : "all"}">${esc(where)}</div>
        ${screens.length ? `<div class="chips">${chips}</div>` : ""}
        <label>Título<input data-f="title" value="${esc(p.title)}" placeholder="(opcional)"></label>
        <div class="two">
          <label>Segundos<input data-f="duration_seconds" type="number" min="2" value="${p.duration_seconds}"></label>
          <span></span>
          <label>Começa<input data-f="starts_at" type="datetime-local" value="${toLocalInput(p.starts_at)}"></label>
          <label>Termina<input data-f="ends_at" type="datetime-local" value="${toLocalInput(p.ends_at)}"></label>
        </div>
        <div class="acts">
          ${canMove ? '<button data-a="left" title="Mover para trás">◀</button><button data-a="right" title="Mover para frente">▶</button>' : ""}
          <button data-a="toggle">${p.active ? "Pausar" : "Ativar"}</button>
          <button data-a="del" class="del">Apagar</button>
        </div>
      </div>
    </div>`;
  }).join("");
}

/* edit fields: saves when you leave the field */
$("list").addEventListener("change", async e => {
  const f = e.target.dataset.f; if (!f) return;
  const card = e.target.closest(".item"), id = card.dataset.id;
  const row = rows.find(r => r.id === id);
  let v = e.target.value;
  if (f === "screen_slugs") {
    // keep slugs of screens that were removed, so the image never jumps to "all screens" by accident
    const orphans = (row.screen_slugs || []).filter(s => !screens.some(x => x.slug === s));
    v = [...card.querySelectorAll('[data-f="screen_slugs"]:checked')].map(x => x.value).concat(orphans);
  }
  else if (f === "duration_seconds") { v = Math.max(2, parseInt(v) || 8); }
  else if (f === "starts_at" || f === "ends_at") v = toISO(v);
  else v = v.trim() || null;
  const { error } = await db.from("promotions").update({ [f]: v }).eq("id", id);
  if (error) return toast(error.message, true);
  row[f] = v; render(); toast("Salvo ✓");
});

/* buttons on each card */
$("list").addEventListener("click", async e => {
  const a = e.target.dataset.a; if (!a) return;
  const id = e.target.closest(".item").dataset.id;
  const idx = rows.findIndex(r => r.id === id);
  if (a === "toggle") {
    const active = !rows[idx].active;
    const { error } = await db.from("promotions").update({ active }).eq("id", id);
    if (error) return toast(error.message, true);
    rows[idx].active = active; render(); toast(active ? "Ativada" : "Pausada");
  } else if (a === "del") {
    if (!confirm("Apagar esta imagem? Não dá para desfazer.")) return;
    await db.storage.from("promos").remove([rows[idx].storage_path]);
    const { error } = await db.from("promotions").delete().eq("id", id);
    if (error) return toast(error.message, true);
    rows.splice(idx, 1); render(); toast("Apagada");
  } else if (a === "left" || a === "right") {
    const j = idx + (a === "left" ? -1 : 1);
    if (j < 0 || j >= rows.length) return;
    [rows[idx], rows[j]] = [rows[j], rows[idx]];
    await savePositions();
  }
});

async function savePositions() {
  render();
  const res = await Promise.all(rows.map((r, pos) => {
    if (r.position === pos) return { error: null };
    r.position = pos;
    return db.from("promotions").update({ position: pos }).eq("id", r.id);
  }));
  const bad = res.find(r => r.error);
  bad ? toast(bad.error.message, true) : toast("Ordem salva ✓");
}

/* drag cards to reorder (only in the "all images" view) */
$("list").addEventListener("dragstart", e => {
  const c = e.target.closest(".item"); if (!c) return;
  dragId = c.dataset.id; c.classList.add("dragging");
});
$("list").addEventListener("dragend", () => { dragId = null; render(); });
$("list").addEventListener("dragover", e => {
  if (!dragId) return; e.preventDefault();
  document.querySelectorAll(".dropbefore").forEach(x => x.classList.remove("dropbefore"));
  const c = e.target.closest(".item"); if (c && c.dataset.id !== dragId) c.classList.add("dropbefore");
});
$("list").addEventListener("drop", async e => {
  if (!dragId) return; e.preventDefault();
  const target = e.target.closest(".item"); if (!target) return;
  const from = rows.findIndex(r => r.id === dragId);
  const [moved] = rows.splice(from, 1);
  const to = rows.findIndex(r => r.id === target.dataset.id);
  rows.splice(to, 0, moved);
  dragId = null; await savePositions();
});

/* ---------- upload ---------- */
const drop = $("drop");
drop.onclick = () => $("file").click();
drop.onkeydown = e => { if (e.key === "Enter" || e.key === " ") $("file").click(); };
$("file").onchange = e => { handleFiles(e.target.files); e.target.value = ""; };
["dragenter", "dragover"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add("over"); }));
["dragleave", "drop"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove("over"); }));
drop.addEventListener("drop", e => { if (e.dataTransfer.files.length) handleFiles(e.dataTransfer.files); });
document.addEventListener("paste", e => {
  const files = [...(e.clipboardData?.files || [])].filter(f => f.type.startsWith("image/"));
  if (files.length && !$("app").hidden) handleFiles(files);
});

/* shrink only very big photos (max 3840px, WebP) so 4K screens stay sharp */
async function compress(file) {
  if (file.type === "image/gif" || file.type === "image/svg+xml") return file;
  try {
    const bmp = await createImageBitmap(file);
    const s = Math.min(1, 3840 / Math.max(bmp.width, bmp.height));
    if (s === 1 && file.size < 1.5 * 1024 * 1024) return file;   // already small: keep original quality
    const c = document.createElement("canvas");
    c.width = Math.round(bmp.width * s); c.height = Math.round(bmp.height * s);
    c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
    const blob = await new Promise(r => c.toBlob(r, "image/webp", .9));
    return blob && blob.size < file.size ? blob : file;
  } catch { return file; }
}

async function handleFiles(fileList) {
  const files = [...fileList].filter(f => f.type.startsWith("image/"));
  if (!files.length) return toast("Escolha arquivos de imagem.", true);
  const q = $("queue"); q.innerHTML = "";
  let pos = rows.length ? Math.max(...rows.map(r => r.position)) + 1 : 0;
  const targets = [...uploadTargets].filter(sl => screens.some(s => s.slug === sl));
  let ok = 0;
  for (const f of files) {
    const line = document.createElement("div"); line.textContent = "⏳ " + f.name; q.appendChild(line);
    try {
      const blob = await compress(f);
      const ext = (blob.type.split("/")[1] || "jpg").replace("jpeg", "jpg").replace("svg+xml", "svg");
      const path = crypto.randomUUID() + "." + ext;
      const up = await db.storage.from("promos").upload(path, blob, { contentType: blob.type });
      if (up.error) throw up.error;
      const url = db.storage.from("promos").getPublicUrl(path).data.publicUrl;
      const ins = await db.from("promotions").insert({
        title: f.name.replace(/\.[^.]+$/, ""),
        image_url: url, storage_path: path,
        duration_seconds: Math.max(2, parseInt($("dur").value) || 8),
        starts_at: toISO($("starts").value), ends_at: toISO($("ends").value),
        screen_slugs: targets,
        position: pos++
      });
      if (ins.error) { await db.storage.from("promos").remove([path]); throw ins.error; }
      line.textContent = "✅ " + f.name; ok++;
    } catch (err) { line.textContent = "❌ " + f.name + " — " + (err.message || err); line.style.color = "var(--bad)"; }
  }
  toast(`${ok} de ${files.length} enviada(s)`, ok < files.length);
  refresh();
}

init();
setInterval(() => { if (!$("app").hidden) render(); }, 60000);        // keeps "No ar / Expirada" badges fresh
